<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

<div class="d-flex justify-content-between align-items-center">
    <h1>Kingsmaly Hotspot Dashboard</h1>
    <a href="/auth/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
</div>

<div class="row mt-4">

<div class="col-md-3">
    <div class="card"><div class="card-body">
        <h5>Users</h5>
        <h2>{{ total_users }}</h2>
    </div></div>
</div>

<div class="col-md-3">
    <div class="card"><div class="card-body">
        <h5>Plans</h5>
        <h2>{{ total_plans }}</h2>
    </div></div>
</div>

<div class="col-md-3">
    <div class="card"><div class="card-body">
        <h5>Payments</h5>
        <h2>{{ total_payments }}</h2>
    </div></div>
</div>

<!-- FIX: total_vouchers was computed by the route but never shown -->
<div class="col-md-3">
    <div class="card"><div class="card-body">
        <h5>Vouchers</h5>
        <h2>{{ total_vouchers }}</h2>
    </div></div>
</div>

</div>

<div class="row mt-4">
<div class="col-md-3">
    <div class="card"><div class="card-body">
        <h5>Revenue</h5>
        <!-- FIX: formatted with thousands separator + 2 decimals -->
        <h2>₦{{ "{:,.2f}".format(revenue) }}</h2>
    </div></div>
</div>
</div>

<div class="mt-4">
    <a href="/admin/plans" class="btn btn-secondary">Manage Plans</a>
    <a href="/admin/vouchers" class="btn btn-secondary">Manage Vouchers</a>
    <a href="/admin/settings" class="btn btn-secondary">Settings</a>
    <a href="/admin/reports/summary" class="btn btn-secondary">Reports (JSON)</a>
</div>

</div>
</body>
</html>
