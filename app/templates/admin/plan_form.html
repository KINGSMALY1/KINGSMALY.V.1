<!DOCTYPE html>
<html>
<head>
<title>{{ "Edit Plan" if plan else "New Plan" }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5" style="max-width: 500px;">

<h2>{{ "Edit Plan" if plan else "New Plan" }}</h2>

<form method="POST" class="mt-4">

<div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" required
           value="{{ plan.name if plan else '' }}"
           placeholder="e.g. 1 Hour Access">
</div>

<div class="mb-3">
    <label class="form-label">Description (optional)</label>
    <input type="text" name="description" class="form-control"
           value="{{ plan.description if plan and plan.description else '' }}"
           placeholder="Shown to customers on the portal page">
</div>

<div class="mb-3">
    <label class="form-label">Price (₦)</label>
    <input type="number" step="0.01" min="0" name="price_naira" class="form-control" required
           value="{{ plan.price_naira if plan else '' }}">
</div>

<div class="mb-3">
    <label class="form-label">Duration (minutes)</label>
    <input type="number" min="1" name="duration_minutes" class="form-control" required
           value="{{ plan.duration_minutes if plan else '' }}"
           placeholder="e.g. 60 for 1 hour, 1440 for 1 day">
</div>

<div class="mb-3">
    <label class="form-label">Sort order</label>
    <input type="number" name="sort_order" class="form-control"
           value="{{ plan.sort_order if plan else 0 }}">
    <div class="form-text">Lower numbers show first on the portal page.</div>
</div>

<button type="submit" class="btn btn-primary">Save</button>
<a href="/admin/plans" class="btn btn-outline-secondary">Cancel</a>

</form>

</div>
</body>
</html>
